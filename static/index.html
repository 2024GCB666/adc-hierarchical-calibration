<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADC 仿真与校准</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/static/style.css?v=16">
</head>
<body>
    <div class="app-container">
        <!-- 第 1 栏：仿真参数配置 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>ADC 建模选项</h2>
                <p id="run_status">等待仿真</p>
            </div>

            <section class="control-group">
                <h3>信号配置</h3>
                <label>
                    <span>采样率 fs (MHz)</span>
                    <input type="number" id="fs" value="1000" step="1">
                </label>
                <label>
                    <span>输入频率 fin (MHz)</span>
                    <input type="number" id="fin" value="61.0504" step="0.0001">
                </label>
                <label>
                    <span>输入幅度</span>
                    <input type="number" id="amplitude" value="511.0" step="1.0">
                </label>
                <label>
                    <span>样本数 N</span>
                    <input type="number" id="sample_count" value="65536" min="16" step="4">
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="auto_coherent">
                    <span>自动选择 coherent N</span>
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="use_bin_mode" checked>
                    <span>按 FFT bin 设置频点</span>
                </label>
                <label id="tone_bin_label">
                    <span>输入 bin</span>
                    <input type="number" id="tone_bin" value="4001" min="1" step="1">
                </label>
            </section>

            <section class="control-group">
                <h3>非理想失配</h3>
                <label class="checkbox-label">
                    <input type="checkbox" id="enable_mismatch" checked>
                    <span>启用失配模型</span>
                </label>
                <div id="mismatch_params">
                    <label>
                        <span>热噪声标准差 noise_std</span>
                        <input type="range" id="noise_std_slider" min="0" max="2" step="0.01" value="0.08">
                        <span id="noise_std_val" class="val-display">0.08</span>
                    </label>
                    <label>
                        <span>CH0 增益 g0</span>
                        <input type="range" id="g0_slider" min="0.9" max="1.1" step="0.001" value="1.0">
                        <span id="g0_val" class="val-display">1.000</span>
                    </label>
                    <label>
                        <span>CH0 失调 o0</span>
                        <input type="range" id="o0_slider" min="-5" max="5" step="0.1" value="0.0">
                        <span id="o0_val" class="val-display">0.0</span>
                    </label>
                    <label>
                        <span>CH1 增益 g1</span>
                        <input type="range" id="g1_slider" min="0.9" max="1.1" step="0.001" value="1.02">
                        <span id="g1_val" class="val-display">1.020</span>
                    </label>
                    <label>
                        <span>CH1 失调 o1</span>
                        <input type="range" id="o1_slider" min="-5" max="5" step="0.1" value="2.0">
                        <span id="o1_val" class="val-display">2.0</span>
                    </label>
                    <label>
                        <span>CH2 增益 g2</span>
                        <input type="range" id="g2_slider" min="0.9" max="1.1" step="0.001" value="1.012">
                        <span id="g2_val" class="val-display">1.012</span>
                    </label>
                    <label>
                        <span>CH2 失调 o2</span>
                        <input type="range" id="o2_slider" min="-5" max="5" step="0.1" value="-1.5">
                        <span id="o2_val" class="val-display">-1.5</span>
                    </label>
                    <label>
                        <span>CH3 增益 g3</span>
                        <input type="range" id="g3_slider" min="0.9" max="1.1" step="0.001" value="1.008">
                        <span id="g3_val" class="val-display">1.008</span>
                    </label>
                    <label>
                        <span>CH3 失调 o3</span>
                        <input type="range" id="o3_slider" min="-5" max="5" step="0.1" value="3.2">
                        <span id="o3_val" class="val-display">3.2</span>
                    </label>
                    <div class="subsection-title">Timing Skew</div>
                    <label>
                        <span>MDAC-A 偏移 dt_A (ps)</span>
                        <input type="range" id="dt_A_slider" min="0" max="100" step="1" value="0">
                        <span id="dt_A_val" class="val-display">0</span>
                    </label>
                    <label>
                        <span>MDAC-B 偏移 dt_B (ps)</span>
                        <input type="range" id="dt_B_slider" min="0" max="100" step="1" value="0">
                        <span id="dt_B_val" class="val-display">0</span>
                    </label>
                </div>
            </section>

            <div class="action-stack">
                <button id="simulate_btn" class="primary-btn">运行仿真</button>
            </div>
        </aside>

        <!-- 第 2 栏：仿真结果与校准设置 -->
        <main id="simulation_page" class="main-content">
            <header class="page-header">
                <div>
                    <h1>ADC 原始数据</h1>
                    <p>当前输出码 FFT 与关键动态指标</p>
                </div>
            </header>

            <section class="metrics-grid">
                <article class="metric-card">
                    <h4>SNDR / SNFR</h4>
                    <div class="metric-value"><span id="sndr_val">--</span> <span class="unit">dB</span></div>
                </article>
                <article class="metric-card">
                    <h4>ENOB</h4>
                    <div class="metric-value"><span id="enob_val">--</span> <span class="unit">bits</span></div>
                </article>
                <article class="metric-card">
                    <h4>SFDR</h4>
                    <div class="metric-value"><span id="sfdr_val">--</span> <span class="unit">dBc</span></div>
                </article>
                <article class="metric-card">
                    <h4>FFT Setup</h4>
                    <div class="metric-value compact"><span id="fft_setup_val">--</span></div>
                </article>
            </section>

            <section class="plot-container">
                <div id="loader" class="loader"></div>
                <img id="spectrum_plot" src="" alt="ADC 输出码 FFT 频谱" hidden>
            </section>

            <div class="calibration-settings-wrapper" style="margin-top: auto; padding-top: 8px;">
                <h2>校准设置</h2>
                <section class="spectrum-panel calibration-controls">
                    <h3 style="margin-bottom: 12px;">校准选项</h3>
                <div class="controls-row">
                    <label title="选择如何生成B组采样时刻的参考信号。后台NLMS会复用这里生成的Dhat_B、Fhat_B和斜率基准s_B。">
                        <span>参考 / 插值方式</span>
                        <select id="reference_method" title="known_tone适合已知单频训练；fractional_delay_fir适合A组低于Nyquist的插值；linear用于快速粗略验证。">
                            <option value="known_tone" selected>已知单频拟合</option>
                            <option value="fractional_delay_fir">FIR 分数延迟插值</option>
                            <option value="linear">线性插值</option>
                        </select>
                    </label>
                    <label id="fir_taps_label" title="FIR分数延迟插值的抽头数。抽头越多参考越准，但计算量更高；必须为奇数。">
                        <span>FIR taps</span>
                        <input type="number" id="fir_taps" value="15" min="3" step="2" title="用于fractional_delay_fir参考方式；程序会把偶数自动调整为下一个奇数。">
                    </label>
                    <label id="known_tone_source_label" title="选择已知单频拟合使用的数据源。A组参考更贴近A预测B；全速数据拟合通常参考更强，但更像前台训练。">
                        <span>单频拟合数据源</span>
                        <select id="known_tone_source" title="仅在参考/插值方式为已知单频拟合时生效。">
                            <option value="A" selected>A 组参考</option>
                            <option value="full">全速数据</option>
                        </select>
                    </label>
                    <label title="选择B组fine path参数的估计方法。两阶段LS/联合LS是前台批处理；后台NLMS是逐样本自适应更新。">
                        <span>B 组估计方式</span>
                        <select id="inter_method" title="选择后台NLMS后会显示步长、训练轮数和收敛追踪参数。">
                            <option value="two_stage" selected>两阶段 LS</option>
                            <option value="joint">联合 LS</option>
                            <option value="nlms">后台 NLMS</option>
                        </select>
                    </label>
                </div>
                <div class="controls-row" id="lms_params" hidden>
                    <label title="NLMS步长。越大收敛越快，但更容易抖动或发散；越小越稳但收敛慢。">
                        <span>NLMS mu</span>
                        <input type="number" id="lms_mu" value="0.005" min="0.000001" step="0.001" title="推荐从0.001到0.02之间扫描，观察convergence samples和rms_res_B_lsb。">
                    </label>
                    <label title="同一批安全样本重复训练的轮数。在线系统通常是一遍流式更新；多轮更适合离线观察收敛趋势。">
                        <span>NLMS epochs</span>
                        <input type="number" id="lms_epochs" value="1" min="1" step="1" title="增大后total coefficient updates会按轮数增加。">
                    </label>
                    <label title="每多少个有效NLMS更新样本记录一次RMS和系数轨迹。越小越细，表征收敛速度越精细。">
                        <span>Trace block</span>
                        <input type="number" id="lms_trace_block_size" value="1024" min="1" step="256" title="convergence block count会受这个参数影响；convergence samples更直观。">
                    </label>
                    <label title="收敛判定阈值。1.1表示进入最终RMS的1.1倍以内并保持住，就认为已收敛。">
                        <span>Settling ratio</span>
                        <input type="number" id="lms_settling_ratio" value="1.1" min="1" step="0.05" title="越接近1.0判定越严格；数值越大越容易判定已收敛。">
                    </label>
                </div>
                <div class="action-stack" style="margin-top: 16px;">
                    <button id="calibrate_btn" class="primary-btn">开始校准</button>
                </div>
            </section>
            </div>
        </main>

        <!-- 第 3 栏：校准结果 -->
        <main id="calibration_page" class="main-content result-page">
            <header class="page-header">
                <div>
                    <h1>校准结果</h1>
                    <p id="calibration_meta">等待校准...</p>
                </div>
            </header>

            <section class="metrics-grid">
                <article class="metric-card">
                    <h4>原始 ENOB</h4>
                    <div class="metric-value"><span id="cal_enob_raw">--</span> <span class="unit">bits</span></div>
                </article>
                <article class="metric-card">
                    <h4>校准后 ENOB</h4>
                    <div class="metric-value"><span id="cal_enob_full">--</span> <span class="unit">bits</span></div>
                </article>
                <article class="metric-card">
                    <h4>ENOB 改善</h4>
                    <div class="metric-value"><span id="cal_enob_gain">--</span> <span class="unit">bits</span></div>
                </article>
                <article class="metric-card">
                    <h4>Safe Samples</h4>
                    <div class="metric-value compact"><span id="cal_safe_samples">--</span></div>
                </article>
            </section>

            <section class="plot-container compact-plot">
                <div id="cal_loader" class="loader"></div>
                <img id="calibration_plot" src="" alt="校准前后指标总结图" hidden>
            </section>

            <section class="spectrum-compare">
                <article class="spectrum-panel">
                    <h3>校准前频谱</h3>
                    <p id="raw_spectrum_caption">--</p>
                    <div class="spectrum-frame">
                        <img id="raw_spectrum_plot" src="" alt="校准前 FFT 频谱" hidden>
                    </div>
                </article>
                <article class="spectrum-panel">
                    <h3>校准后频谱</h3>
                    <p id="calibrated_spectrum_caption">--</p>
                    <div class="spectrum-frame">
                        <img id="calibrated_spectrum_plot" src="" alt="校准后 FFT 频谱" hidden>
                    </div>
                </article>
            </section>

            <section class="table-grid">
                <article class="table-panel">
                    <h3>性能对比</h3>
                    <div id="performance_table" class="table-wrap"></div>
                </article>
                <article class="table-panel">
                    <h3>校准系数</h3>
                    <div id="coefficients_table" class="table-wrap"></div>
                </article>
                <article class="table-panel">
                    <h3>时序失配</h3>
                    <div id="timing_table" class="table-wrap"></div>
                </article>
                <article class="table-panel">
                    <h3>后台收敛</h3>
                    <div id="diagnostics_table" class="table-wrap"></div>
                </article>
            </section>

            <section class="file-panel">
                <h3>输出文件</h3>
                <div id="output_files" class="file-list">--</div>
            </section>
        </main>
    </div>

    <script src="/static/main.js?v=16"></script>
</body>
</html>
